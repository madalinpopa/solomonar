<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="960" height="688" viewBox="0 0 960 688" role="img" aria-label="The building blocks of Solomonar: runtime adapters for Claude Code and Codex load the framework core in docs/solomonar/, its contracts, skills, and agent roles; optional extensions, the go and extension-authoring skills from the catalog or your own skills and reviewers, add stack rules, procedures, and extra reviewers; skills write the project documents every role reads; the solomonar CLI installs the core, adapters, and extensions and upgrades the framework; and the orchestrator changes task state only through the CLI, which keeps the registry in Git.">
<style>
svg {
  --bg: #F2F4F1; --surface: #FFFFFF; --ink: #18211E; --muted: #56625D; --line: #9AA7A1; --grid: #DDE3DF;
  --acc: #1D6B86; --acc-soft: #DCEBF0; --warn: #A85A12; --warn-soft: #F6E7D6;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { svg {
  --bg: #121816; --surface: #1B2320; --ink: #E4EBE7; --muted: #9BA9A3; --line: #5C6B64; --grid: #26302C;
  --acc: #6CB8D3; --acc-soft: #173440; --warn: #E09A55; --warn-soft: #3A2A1A; color-scheme: dark; } }



svg { font-family: var(--sans); }
.bg { fill: var(--surface); }
/* diagram vocabulary */
.dg text { font-family: var(--sans); }
.dg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.dg .box-acc { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 1.25; }
.dg .box-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.25; }
.dg .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
.dg .t { font-size: 14px; font-weight: 600; fill: var(--ink); }
.dg .t-sm { font-size: 12px; font-weight: 500; fill: var(--ink); }
.dg .s { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.dg .s-acc { font-family: var(--mono); font-size: 11px; fill: var(--acc); font-weight: 500; }
.dg .s-warn { font-family: var(--mono); font-size: 11px; fill: var(--warn); font-weight: 500; }
.dg .lbl { font-size: 11.5px; fill: var(--muted); }
.dg .lbl-warn { font-size: 11.5px; fill: var(--warn); font-weight: 500; }
.dg .ph { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; fill: var(--muted); }
.dg .rule { stroke: var(--line); stroke-width: 1; }
.dg .lane { stroke: var(--grid); stroke-width: 2; }
.dg .lane-strong { stroke: var(--line); stroke-width: 2.5; fill: none; }
.dg .e { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.dg .e-acc { stroke: var(--acc); stroke-width: 1.4; fill: none; }
.dg .e-warn { stroke: var(--warn); stroke-width: 1.4; fill: none; }
.dg .dash { stroke-dasharray: 5 4; }
.dg .mk { fill: var(--ink); }
.dg .mk-acc { fill: var(--acc); }
.dg .mk-warn { fill: var(--warn); }
.dg .dot { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.dg .dot-acc { fill: var(--acc); stroke: var(--acc); stroke-width: 1.5; }
.dg .dot-warn { fill: var(--warn); stroke: var(--warn); stroke-width: 1.5; }
.dg .bar { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 1; }
.dg .bar-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1; }
.dg .bar-t { font-size: 11px; fill: var(--ink); }
.dg .ink { fill: var(--ink); }
</style>
