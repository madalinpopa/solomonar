<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-label="On the feature branch, the final spec commit becomes spec_ref and one last commit deletes the work spec; the merge commit keeps both in main's history, and solomonar task done writes the compact record with spec_ref and merge_commit.">
<style>
svg {
  --bg: #F2F4F1; --surface: #FFFFFF; --ink: #18211E; --muted: #56625D; --line: #9AA7A1; --grid: #DDE3DF;
  --acc: #1D6B86; --acc-soft: #DCEBF0; --warn: #A85A12; --warn-soft: #F6E7D6;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { svg {
  --bg: #121816; --surface: #1B2320; --ink: #E4EBE7; --muted: #9BA9A3; --line: #5C6B64; --grid: #26302C;
  --acc: #6CB8D3; --acc-soft: #173440; --warn: #E09A55; --warn-soft: #3A2A1A; color-scheme: dark; } }



svg { font-family: var(--sans); }
.bg { fill: var(--surface); }
/* diagram vocabulary */
.dg text { font-family: var(--sans); }
.dg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.dg .box-acc { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 1.25; }
.dg .box-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.25; }
.dg .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
.dg .t { font-size: 14px; font-weight: 600; fill: var(--ink); }
.dg .t-sm { font-size: 12px; font-weight: 500; fill: var(--ink); }
.dg .s { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.dg .s-acc { font-family: var(--mono); font-size: 11px; fill: var(--acc); font-weight: 500; }
.dg .s-warn { font-family: var(--mono); font-size: 11px; fill: var(--warn); font-weight: 500; }
.dg .lbl { font-size: 11.5px; fill: var(--muted); }
.dg .lbl-warn { font-size: 11.5px; fill: var(--warn); font-weight: 500; }
.dg .ph { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; fill: var(--muted); }
.dg .rule { stroke: var(--line); stroke-width: 1; }
.dg .lane { stroke: var(--grid); stroke-width: 2; }
.dg .lane-strong { stroke: var(--line); stroke-width: 2.5; fill: none; }
.dg .e { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.dg .e-acc { stroke: var(--acc); stroke-width: 1.4; fill: none; }
.dg .e-warn { stroke: var(--warn); stroke-width: 1.4; fill: none; }
.dg .dash { stroke-dasharray: 5 4; }
.dg .mk { fill: var(--ink); }
.dg .mk-acc { fill: var(--acc); }
.dg .mk-warn { fill: var(--warn); }
.dg .dot { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.dg .dot-acc { fill: var(--acc); stroke: var(--acc); stroke-width: 1.5; }
.dg .dot-warn { fill: var(--warn); stroke: var(--warn); stroke-width: 1.5; }
.dg .bar { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 1; }
.dg .bar-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1; }
.dg .bar-t { font-size: 11px; fill: var(--ink); }
.dg .ink { fill: var(--ink); }
</style>
<rect class="bg" width="960" height="230"/>
      <defs>
        <marker id="f5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-acc"/></marker>
      </defs>
      <text class="s" x="40" y="158">main</text>
      <line class="lane-strong" x1="40" y1="170" x2="920" y2="170"/>
      <path class="lane-strong" d="M120 170 C150 170 150 90 180 90 H610 C640 90 640 170 660 170"/>
      <text class="s" x="190" y="78">feature/W-001</text>

      <circle class="dot" cx="80" cy="170" r="5"/>
      <circle class="dot" cx="120" cy="170" r="5"/>
      <circle class="dot" cx="210" cy="90" r="5"/><text class="s" x="210" y="114" text-anchor="middle">work spec</text>
      <circle class="dot" cx="295" cy="90" r="5"/><text class="s" x="295" y="114" text-anchor="middle">implementation</text>
      <circle class="dot" cx="370" cy="90" r="5"/><text class="s" x="370" y="114" text-anchor="middle">fix</text>
      <circle class="dot-acc" cx="460" cy="90" r="7"/>
      <text class="s-acc" x="460" y="114" text-anchor="middle">spec(W-001)</text>
      <text class="s-acc" x="460" y="128" text-anchor="middle">final = spec_ref</text>
      <circle class="dot-warn" cx="565" cy="90" r="6"/>
      <text class="s" x="565" y="114" text-anchor="middle">docs(W-001):</text>
      <text class="s" x="565" y="128" text-anchor="middle">remove work spec</text>
      <circle class="dot" cx="660" cy="170" r="7"/><text class="s" x="660" y="194" text-anchor="middle">merge commit</text>
      <text class="s" x="820" y="194" text-anchor="middle">solomonar task done</text>
      <text class="s" x="820" y="210" text-anchor="middle">writes the record</text>

      <rect class="box-acc" x="690" y="14" width="250" height="96" rx="4"/>
      <text class="t-sm" x="704" y="36">Compact tasks/W-001.json</text>
      <text class="s" x="704" y="56">done · complete</text>
      <text class="s" x="704" y="74">spec_ref = SHA_SPEC:path</text>
      <text class="s" x="704" y="92">merge_commit = SHA_MERGE</text>

      <path class="e-acc dash" d="M690 50 L470 86" marker-end="url(#f5c)"/>
      <text class="lbl" x="590" y="56" text-anchor="middle">git show</text>
      <path class="e-acc dash" d="M720 110 L668 162" marker-end="url(#f5c)"/>
    </svg>
