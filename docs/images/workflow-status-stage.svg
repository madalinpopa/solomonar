<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="1000" height="352" viewBox="0 0 1000 352" role="img" aria-label="Stage shows where the task is in the workflow, from setup to complete; status shows whether it can advance: planned, reserved, running, done, with the blocked, paused, and cancelled branches. Only a confirmed merge leads to done and complete.">
<style>
svg {
  --bg: #F2F4F1; --surface: #FFFFFF; --ink: #18211E; --muted: #56625D; --line: #9AA7A1; --grid: #DDE3DF;
  --acc: #1D6B86; --acc-soft: #DCEBF0; --warn: #A85A12; --warn-soft: #F6E7D6;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { svg {
  --bg: #121816; --surface: #1B2320; --ink: #E4EBE7; --muted: #9BA9A3; --line: #5C6B64; --grid: #26302C;
  --acc: #6CB8D3; --acc-soft: #173440; --warn: #E09A55; --warn-soft: #3A2A1A; color-scheme: dark; } }



svg { font-family: var(--sans); }
.bg { fill: var(--surface); }
/* diagram vocabulary */
.dg text { font-family: var(--sans); }
.dg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.dg .box-acc { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 1.25; }
.dg .box-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.25; }
.dg .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
.dg .t { font-size: 14px; font-weight: 600; fill: var(--ink); }
.dg .t-sm { font-size: 12px; font-weight: 500; fill: var(--ink); }
.dg .s { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.dg .s-acc { font-family: var(--mono); font-size: 11px; fill: var(--acc); font-weight: 500; }
.dg .s-warn { font-family: var(--mono); font-size: 11px; fill: var(--warn); font-weight: 500; }
.dg .lbl { font-size: 11.5px; fill: var(--muted); }
.dg .lbl-warn { font-size: 11.5px; fill: var(--warn); font-weight: 500; }
.dg .ph { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; fill: var(--muted); }
.dg .rule { stroke: var(--line); stroke-width: 1; }
.dg .lane { stroke: var(--grid); stroke-width: 2; }
.dg .lane-strong { stroke: var(--line); stroke-width: 2.5; fill: none; }
.dg .e { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.dg .e-acc { stroke: var(--acc); stroke-width: 1.4; fill: none; }
.dg .e-warn { stroke: var(--warn); stroke-width: 1.4; fill: none; }
.dg .dash { stroke-dasharray: 5 4; }
.dg .mk { fill: var(--ink); }
.dg .mk-acc { fill: var(--acc); }
.dg .mk-warn { fill: var(--warn); }
.dg .dot { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.dg .dot-acc { fill: var(--acc); stroke: var(--acc); stroke-width: 1.5; }
.dg .dot-warn { fill: var(--warn); stroke: var(--warn); stroke-width: 1.5; }
.dg .bar { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 1; }
.dg .bar-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1; }
.dg .bar-t { font-size: 11px; fill: var(--ink); }
.dg .ink { fill: var(--ink); }
</style>
<rect class="bg" width="1000" height="352"/>
      <defs>
        <marker id="f4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker>
        <marker id="f4w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-warn"/></marker>
      </defs>

      <text class="ph" x="20" y="16">STAGE · WHERE THE TASK IS</text>
      <text class="lbl" x="427" y="40" text-anchor="middle">status running (or blocked / paused, stage kept)</text>
      <line class="rule" x1="60" y1="47" x2="793" y2="47"/>
      <text class="lbl" x="940" y="40" text-anchor="middle">status done</text>
      <line class="rule" x1="905" y1="47" x2="975" y2="47"/>
      <line class="e-warn dash" x1="866" y1="28" x2="866" y2="112"/>
      <text class="s-warn" x="866" y="22" text-anchor="middle">merge confirmed</text>

      <line class="e" x1="60" y1="70" x2="940" y2="70"/>
      <circle class="dot" cx="60" cy="70" r="6"/><text class="s" x="60" y="94" text-anchor="middle">setup</text>
      <circle class="dot" cx="207" cy="70" r="6"/><text class="s" x="207" y="94" text-anchor="middle">specification</text>
      <circle class="dot" cx="353" cy="70" r="6"/><text class="s" x="353" y="94" text-anchor="middle">implementation</text>
      <circle class="dot" cx="500" cy="70" r="6"/><text class="s" x="500" y="94" text-anchor="middle">specialized_review</text>
      <circle class="dot" cx="647" cy="70" r="6"/><text class="s" x="647" y="94" text-anchor="middle">adversarial_review</text>
      <circle class="dot" cx="793" cy="70" r="6"/><text class="s" x="793" y="94" text-anchor="middle">integration</text>
      <circle class="dot-acc" cx="940" cy="70" r="6"/><text class="s" x="940" y="94" text-anchor="middle">complete</text>

      <path class="e-warn" d="M793 104 C793 138 353 138 353 106" marker-end="url(#f4w)"/>
      <text class="lbl-warn" x="573" y="152" text-anchor="middle">fixes: back to implementation, same task ID</text>

      <text class="ph" x="20" y="186">STATUS · CAN IT ADVANCE?</text>

      <rect class="box" x="30" y="200" width="100" height="36" rx="18"/>
      <text class="s ink" x="80" y="222" text-anchor="middle">planned</text>
      <rect class="box" x="210" y="200" width="100" height="36" rx="18"/>
      <text class="s ink" x="260" y="222" text-anchor="middle">reserved</text>
      <rect class="box-acc" x="400" y="200" width="110" height="36" rx="18"/>
      <text class="s-acc" x="455" y="222" text-anchor="middle">running</text>
      <rect class="box-acc" x="780" y="200" width="100" height="36" rx="18"/>
      <text class="s-acc" x="830" y="222" text-anchor="middle">done</text>

      <path class="e" d="M130 218 H208" marker-end="url(#f4a)"/>
      <text class="lbl" x="170" y="210" text-anchor="middle">register</text>
      <path class="e" d="M310 218 H398" marker-end="url(#f4a)"/>
      <text class="lbl" x="355" y="210" text-anchor="middle">worktree</text>
      <path class="e" d="M510 218 H778" marker-end="url(#f4a)"/>
      <text class="lbl" x="645" y="210" text-anchor="middle">task done after a confirmed merge</text>
      <text class="s" x="830" y="258" text-anchor="middle">regression → new task</text>
      <text class="s" x="80" y="258" text-anchor="middle">task plan (user)</text>

      <rect class="box-warn" x="230" y="290" width="110" height="36" rx="18"/>
      <text class="s-warn" x="285" y="312" text-anchor="middle">blocked</text>
      <rect class="box" x="400" y="290" width="110" height="36" rx="18"/>
      <text class="s ink" x="455" y="312" text-anchor="middle">paused</text>
      <rect class="box" x="570" y="290" width="110" height="36" rx="18"/>
      <text class="s ink" x="625" y="312" text-anchor="middle">cancelled</text>

      <path class="e" d="M410 238 L322 288" marker-start="url(#f4a)" marker-end="url(#f4a)"/>
      <text class="lbl" x="352" y="258" text-anchor="end">blocker</text>
      <path class="e" d="M455 238 V288" marker-start="url(#f4a)" marker-end="url(#f4a)"/>
      <text class="lbl" x="463" y="268">pause</text>
      <path class="e" d="M500 238 L608 288" marker-end="url(#f4a)"/>
      <text class="lbl" x="578" y="256">cancel</text>

      <text class="s" x="285" y="344" text-anchor="middle">decision · dependency · check · environment</text>
      <text class="s" x="640" y="344" text-anchor="middle">resumes only on user request</text>
    </svg>
