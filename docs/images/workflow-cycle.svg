<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="960" height="415" viewBox="0 0 960 415" role="img" aria-label="The Solomonar cycle: prototype and spec discover the product, solomonar task register and work-spec prepare the task, then implementation, tiered reviews, PR with merge, and solomonar task done; CHANGES_REQUIRED sends the task back to implementation.">
<style>
svg {
  --bg: #F2F4F1; --surface: #FFFFFF; --ink: #18211E; --muted: #56625D; --line: #9AA7A1; --grid: #DDE3DF;
  --acc: #1D6B86; --acc-soft: #DCEBF0; --warn: #A85A12; --warn-soft: #F6E7D6;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { svg {
  --bg: #121816; --surface: #1B2320; --ink: #E4EBE7; --muted: #9BA9A3; --line: #5C6B64; --grid: #26302C;
  --acc: #6CB8D3; --acc-soft: #173440; --warn: #E09A55; --warn-soft: #3A2A1A; color-scheme: dark; } }



svg { font-family: var(--sans); }
.bg { fill: var(--surface); }
/* diagram vocabulary */
.dg text { font-family: var(--sans); }
.dg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.dg .box-acc { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 1.25; }
.dg .box-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.25; }
.dg .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
.dg .t { font-size: 14px; font-weight: 600; fill: var(--ink); }
.dg .t-sm { font-size: 12px; font-weight: 500; fill: var(--ink); }
.dg .s { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.dg .s-acc { font-family: var(--mono); font-size: 11px; fill: var(--acc); font-weight: 500; }
.dg .s-warn { font-family: var(--mono); font-size: 11px; fill: var(--warn); font-weight: 500; }
.dg .lbl { font-size: 11.5px; fill: var(--muted); }
.dg .lbl-warn { font-size: 11.5px; fill: var(--warn); font-weight: 500; }
.dg .ph { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; fill: var(--muted); }
.dg .rule { stroke: var(--line); stroke-width: 1; }
.dg .lane { stroke: var(--grid); stroke-width: 2; }
.dg .lane-strong { stroke: var(--line); stroke-width: 2.5; fill: none; }
.dg .e { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.dg .e-acc { stroke: var(--acc); stroke-width: 1.4; fill: none; }
.dg .e-warn { stroke: var(--warn); stroke-width: 1.4; fill: none; }
.dg .dash { stroke-dasharray: 5 4; }
.dg .mk { fill: var(--ink); }
.dg .mk-acc { fill: var(--acc); }
.dg .mk-warn { fill: var(--warn); }
.dg .dot { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.dg .dot-acc { fill: var(--acc); stroke: var(--acc); stroke-width: 1.5; }
.dg .dot-warn { fill: var(--warn); stroke: var(--warn); stroke-width: 1.5; }
.dg .bar { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 1; }
.dg .bar-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1; }
.dg .bar-t { font-size: 11px; fill: var(--ink); }
.dg .ink { fill: var(--ink); }
</style>
<rect class="bg" width="960" height="415"/>
      <defs>
        <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker>
        <marker id="f1w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-warn"/></marker>
      </defs>
      <text class="ph" x="45" y="24">DISCOVERY</text>
      <line class="rule" x1="45" y1="32" x2="435" y2="32"/>
      <text class="ph" x="525" y="24">PREPARATION · ONE TASK AT A TIME</text>
      <line class="rule" x1="525" y1="32" x2="915" y2="32"/>

      <path class="e dash" d="M360 90 C360 50 120 50 120 88" marker-end="url(#f1a)"/>
      <text class="lbl" x="240" y="81" text-anchor="middle">open questions</text>

      <rect class="box-acc" x="45" y="90" width="150" height="70" rx="4"/>
      <text class="t" x="120" y="121" text-anchor="middle">Prototype</text>
      <text class="s" x="120" y="142" text-anchor="middle">prototype/</text>

      <rect class="box-acc" x="285" y="90" width="150" height="70" rx="4"/>
      <text class="t" x="360" y="121" text-anchor="middle">Spec</text>
      <text class="s" x="360" y="142" text-anchor="middle">docs/specs/*.md</text>

      <rect class="box" x="525" y="90" width="150" height="70" rx="4"/>
      <text class="t" x="600" y="121" text-anchor="middle">Registration</text>
      <text class="s" x="600" y="142" text-anchor="middle">task register</text>

      <rect class="box-acc" x="765" y="90" width="150" height="70" rx="4"/>
      <text class="t" x="840" y="121" text-anchor="middle">Work-spec</text>
      <text class="s" x="840" y="142" text-anchor="middle">docs/work/W-001-*.md</text>

      <path class="e" d="M195 125 H283" marker-end="url(#f1a)"/>
      <text class="lbl" x="240" y="116" text-anchor="middle">tested flow</text>
      <path class="e" d="M435 125 H523" marker-end="url(#f1a)"/>
      <text class="lbl" x="480" y="116" text-anchor="middle">task selected</text>
      <path class="e" d="M675 125 H763" marker-end="url(#f1a)"/>
      <text class="lbl" x="720" y="103" text-anchor="middle">registered,</text>
      <text class="lbl" x="720" y="116" text-anchor="middle">then worktree</text>

      <path class="e" d="M840 160 V263" marker-end="url(#f1a)"/>
      <text class="lbl" x="852" y="208">readiness OK,</text>
      <text class="lbl" x="852" y="222">specs updated</text>

      <text class="ph" x="45" y="250">EXECUTION · IN PARALLEL, ONE WORKTREE PER TASK</text>

      <rect class="box" x="765" y="265" width="150" height="70" rx="4"/>
      <text class="t" x="840" y="296" text-anchor="middle">Implementation</text>
      <text class="s" x="840" y="317" text-anchor="middle">approach, tests, code</text>

      <rect class="box" x="525" y="265" width="150" height="70" rx="4"/>
      <text class="t" x="600" y="296" text-anchor="middle">Reviews</text>
      <text class="s" x="600" y="317" text-anchor="middle">tiered by risk</text>

      <rect class="box" x="285" y="265" width="150" height="70" rx="4"/>
      <text class="t" x="360" y="296" text-anchor="middle">PR + merge</text>
      <text class="s" x="360" y="317" text-anchor="middle">final spec, merge</text>

      <rect class="box" x="45" y="265" width="150" height="70" rx="4"/>
      <text class="t" x="120" y="296" text-anchor="middle">Task done</text>
      <text class="s" x="120" y="317" text-anchor="middle">compact record</text>

      <path class="e" d="M765 300 H677" marker-end="url(#f1a)"/>
      <text class="lbl" x="720" y="279" text-anchor="middle">candidate</text>
      <text class="lbl" x="720" y="291" text-anchor="middle">revision</text>
      <path class="e" d="M525 300 H437" marker-end="url(#f1a)"/>
      <text class="s" x="480" y="291" text-anchor="middle">PASS</text>
      <path class="e" d="M285 300 H197" marker-end="url(#f1a)"/>
      <text class="lbl" x="240" y="279" text-anchor="middle">merge</text>
      <text class="lbl" x="240" y="291" text-anchor="middle">confirmed</text>

      <path class="e-warn" d="M600 335 C600 385 840 385 840 337" marker-end="url(#f1w)"/>
      <text class="s-warn" x="720" y="402" text-anchor="middle">CHANGES_REQUIRED</text>
    </svg>
