<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="980" height="365" viewBox="0 0 980 365" role="img" aria-label="Timeline: orch-01 registers W-001 with solomonar task register, and only then can orch-02 start. The two tasks run in parallel in separate worktrees; merges into main happen one at a time, and W-002 updates from main before its own merge.">
<style>
svg {
  --bg: #F2F4F1; --surface: #FFFFFF; --ink: #18211E; --muted: #56625D; --line: #9AA7A1; --grid: #DDE3DF;
  --acc: #1D6B86; --acc-soft: #DCEBF0; --warn: #A85A12; --warn-soft: #F6E7D6;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { svg {
  --bg: #121816; --surface: #1B2320; --ink: #E4EBE7; --muted: #9BA9A3; --line: #5C6B64; --grid: #26302C;
  --acc: #6CB8D3; --acc-soft: #173440; --warn: #E09A55; --warn-soft: #3A2A1A; color-scheme: dark; } }



svg { font-family: var(--sans); }
.bg { fill: var(--surface); }
/* diagram vocabulary */
.dg text { font-family: var(--sans); }
.dg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.dg .box-acc { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 1.25; }
.dg .box-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.25; }
.dg .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
.dg .t { font-size: 14px; font-weight: 600; fill: var(--ink); }
.dg .t-sm { font-size: 12px; font-weight: 500; fill: var(--ink); }
.dg .s { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.dg .s-acc { font-family: var(--mono); font-size: 11px; fill: var(--acc); font-weight: 500; }
.dg .s-warn { font-family: var(--mono); font-size: 11px; fill: var(--warn); font-weight: 500; }
.dg .lbl { font-size: 11.5px; fill: var(--muted); }
.dg .lbl-warn { font-size: 11.5px; fill: var(--warn); font-weight: 500; }
.dg .ph { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; fill: var(--muted); }
.dg .rule { stroke: var(--line); stroke-width: 1; }
.dg .lane { stroke: var(--grid); stroke-width: 2; }
.dg .lane-strong { stroke: var(--line); stroke-width: 2.5; fill: none; }
.dg .e { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.dg .e-acc { stroke: var(--acc); stroke-width: 1.4; fill: none; }
.dg .e-warn { stroke: var(--warn); stroke-width: 1.4; fill: none; }
.dg .dash { stroke-dasharray: 5 4; }
.dg .mk { fill: var(--ink); }
.dg .mk-acc { fill: var(--acc); }
.dg .mk-warn { fill: var(--warn); }
.dg .dot { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.dg .dot-acc { fill: var(--acc); stroke: var(--acc); stroke-width: 1.5; }
.dg .dot-warn { fill: var(--warn); stroke: var(--warn); stroke-width: 1.5; }
.dg .bar { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 1; }
.dg .bar-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1; }
.dg .bar-t { font-size: 11px; fill: var(--ink); }
.dg .ink { fill: var(--ink); }
</style>
<rect class="bg" width="980" height="365"/>
      <defs>
        <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker>
        <marker id="f3c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-acc"/></marker>
      </defs>

      <text class="t-sm" x="20" y="66">orch-01</text><text class="s" x="20" y="82">task W-001</text>
      <text class="t-sm" x="20" y="146">tasks/*.json</text><text class="s" x="20" y="162">update-ref CAS</text>
      <text class="t-sm" x="20" y="226">orch-02</text><text class="s" x="20" y="242">task W-002</text>
      <text class="t-sm" x="20" y="306">main</text><text class="s" x="20" y="322">code + docs</text>

      <line class="lane" x1="170" y1="70" x2="960" y2="70"/>
      <line class="lane" x1="170" y1="150" x2="960" y2="150"/>
      <line class="lane" x1="170" y1="230" x2="960" y2="230"/>
      <line class="lane" x1="170" y1="310" x2="960" y2="310"/>

      <!-- barrier -->
      <line class="e-warn dash" x1="230" y1="156" x2="230" y2="338"/>
      <text class="lbl-warn" x="238" y="352">barrier: task register succeeded → the user may start task 2</text>

      <!-- orch-01 -->
      <rect class="bar" x="180" y="60" width="50" height="20" rx="2"/>
      <text class="bar-t" x="205" y="74" text-anchor="middle">reg.</text>
      <rect class="bar" x="245" y="60" width="495" height="20" rx="2"/>
      <text class="bar-t" x="492" y="74" text-anchor="middle">worktree W-001 · work spec · implementation · reviews · closure</text>
      <rect class="box" x="775" y="60" width="100" height="20" rx="2"/>
      <text class="bar-t" x="825" y="74" text-anchor="middle">task done</text>
      <path class="e-acc" d="M230 80 V143" marker-end="url(#f3c)"/>
      <path class="e-acc" d="M580 80 V143" marker-end="url(#f3c)"/>
      <path class="e" d="M740 70 H760 V302" marker-end="url(#f3a)"/>

      <!-- orch-02 -->
      <rect class="bar" x="370" y="220" width="50" height="20" rx="2"/>
      <text class="bar-t" x="395" y="234" text-anchor="middle">reg.</text>
      <rect class="bar" x="435" y="220" width="313" height="20" rx="2"/>
      <text class="bar-t" x="591" y="234" text-anchor="middle">worktree W-002 · work spec · impl · review</text>
      <rect class="bar-warn" x="772" y="220" width="108" height="20" rx="2"/>
      <text class="bar-t" x="826" y="234" text-anchor="middle">update from main</text>
      <path class="e-acc" d="M420 220 V157" marker-end="url(#f3c)"/>
      <path class="e" d="M880 230 H890 V302" marker-end="url(#f3a)"/>
      <path class="e-acc" d="M890 230 V157" marker-end="url(#f3c)"/>

      <!-- state commits -->
      <circle class="dot-acc" cx="230" cy="150" r="5"/><text class="s" x="238" y="144">W-001 reserved</text>
      <circle class="dot-acc" cx="420" cy="150" r="5"/><text class="s" x="428" y="144">W-002 reserved</text>
      <circle class="dot-acc" cx="580" cy="150" r="5"/><text class="s" x="588" y="144">W-001 review</text>
      <circle class="dot-acc" cx="760" cy="150" r="5"/><text class="s" x="768" y="144">W-001 done</text>
      <circle class="dot-acc" cx="890" cy="150" r="5"/><text class="s" x="898" y="144">W-002 done</text>

      <!-- main merges -->
      <circle class="dot" cx="760" cy="310" r="6"/><text class="s" x="770" y="302">merge W-001</text>
      <circle class="dot" cx="890" cy="310" r="6"/><text class="s" x="900" y="302">merge W-002</text>
    </svg>
