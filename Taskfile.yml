version: '3'

set: [pipefail]

vars:
  MAIN: .
  BIN: '{{.ROOT_DIR}}/bin'
  TOOLS: '{{.ROOT_DIR}}/.bin'
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

tasks:
  default:
    cmd: task --list
    silent: true

  build:
    desc: Build bin/solomonar
    sources: ['**/*.go', go.mod, go.sum, assets/**/*]
    generates: ['{{.BIN}}/solomonar']
    cmd: go build -trimpath -o {{.BIN}}/solomonar {{.MAIN}}

  install:
    desc: Install solomonar into GOBIN
    cmd: go install -trimpath {{.MAIN}}

  run:
    desc: 'Run the CLI from source, e.g. task run -- task show'
    cmd: go run {{.MAIN}} {{.CLI_ARGS}}

  test:
    desc: Run all tests with the race detector
    cmd: go test -race ./...

  test:integration:
    desc: Run all tests with the race detector, transcript tests included
    cmd: go test -race ./...
    env:
      INTEGRATION: 'true'

  cover:
    desc: Run the tests and print total coverage
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -n 1

  fmt:
    desc: Format the code with the configured formatters
    deps: [tools]
    cmd: '{{.TOOLS}}/golangci-lint fmt'

  lint:
    desc: Check go.mod is tidy and run golangci-lint
    deps: [tools]
    cmds:
      - go mod tidy -diff
      - '{{.TOOLS}}/golangci-lint run'

  security:
    desc: Report known vulnerabilities reachable from the code
    deps: [tools]
    cmd: '{{.TOOLS}}/govulncheck ./...'

  check:
    desc: Run lint, tests, and security checks, as CI does
    cmds:
      - task: lint
      - task: test
      - task: security

  tools:
    desc: Install the pinned golangci-lint and govulncheck into .bin
    run: once
    cmds:
      - GOBIN={{.TOOLS}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - GOBIN={{.TOOLS}} go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
    status:
      - go version -m {{.TOOLS}}/golangci-lint | grep -q 'golangci-lint/v2[[:space:]]*{{.GOLANGCI_LINT_VERSION}}'
      - go version -m {{.TOOLS}}/govulncheck | grep -q 'golang.org/x/vuln[[:space:]]*{{.GOVULNCHECK_VERSION}}'

  clean:
    desc: Remove build outputs and coverage
    cmd: rm -rf {{.BIN}} coverage.out

  version:set:
    desc: 'Set current release headers and examples, preserving historical versions'
    requires: {vars: [VERSION]}
    cmd: perl scripts/set-version.pl '{{.VERSION}}'

  release:next:
    desc: Tag and push the next patch release
    cmds:
      - task: release:patch

  release:patch:
    desc: Tag and push the next patch release (vX.Y.Z+1)
    cmds:
      - task: _release
        vars: {BUMP: patch}

  release:minor:
    desc: Tag and push the next minor release (vX.Y+1.0)
    cmds:
      - task: _release
        vars: {BUMP: minor}

  release:major:
    desc: Tag and push the next major release (vX+1.0.0)
    cmds:
      - task: _release
        vars: {BUMP: major}

  _release:
    internal: true
    vars:
      LATEST:
        sh: git fetch --quiet --tags origin && git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true
      NEXT:
        sh: |
          v='{{.LATEST | default "v0.0.0"}}'; v=${v#v}
          M=${v%%.*}; r=${v#*.}; m=${r%%.*}; p=${r#*.}
          case '{{.BUMP}}' in
            major) echo "v$((M + 1)).0.0" ;;
            minor) echo "v$M.$((m + 1)).0" ;;
            patch) echo "v$M.$m.$((p + 1))" ;;
          esac
    preconditions:
      - sh: git fetch --quiet origin main && git merge-base --is-ancestor HEAD origin/main
        msg: HEAD is not on origin/main; push main first, since the release workflow rejects other commits.
      - sh: '! git rev-parse -q --verify "refs/tags/{{.NEXT}}" >/dev/null'
        msg: Tag {{.NEXT}} already exists.
      - sh: git diff --quiet HEAD
        msg: The worktree has uncommitted changes; commit or discard them first.
    prompt: Set the version to {{.NEXT}}, commit and push it to main, then tag {{.LATEST | default "no release"}} -> {{.NEXT}} and push the tag?
    cmds:
      - task: version:set
        vars: {VERSION: '{{trimPrefix "v" .NEXT}}'}
      - 'git commit -aqm "chore(release): {{.NEXT}}"'
      - git push origin HEAD:main
      - git tag -a {{.NEXT}} -m "Release {{.NEXT}}"
      - git push origin {{.NEXT}}
      - echo "Pushed {{.NEXT}}; the release workflow runs on GitHub Actions."
