version: 2

project_name: solomonar

builds:
  - main: .
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # The CLI reads its version from the VCS stamp (AD-10), so no -X flags.
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]

checksum:
  algorithm: sha256

changelog:
  use: github-native

release:
  prerelease: auto

homebrew_casks:
  - name: solomonar
    binaries: [solomonar]
    homepage: https://github.com/madalinpopa/solomonar
    description: Spec-driven workflow for coding agents, from intent to verified code
    license: MIT
    # A prerelease tag leaves the tap on the last stable version.
    skip_upload: auto
    repository:
      owner: madalinpopa
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_msg_template: "solomonar {{ .Tag }}"
    # The binaries are not notarized, so Gatekeeper would block them.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/solomonar"]
        end
      end
